<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knos demand check: waking the server</title>
<meta name="description" content="Knos's demand check runs on a free server that sleeps when idle. This page wakes it, then takes you there.">
<style>
:root { --bg: #f7f7f4; --ink: #17181a; --muted: #5d6168; --accent: #2d5bd7; }
@media (prefers-color-scheme: dark) { :root { --bg: #111214; --ink: #ecedee; --muted: #a3a8b0; --accent: #7aa2ff; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 26px; } a { color: var(--accent); } .muted { color: var(--muted); }
.bar { height: 6px; background: rgba(127,127,127,.25); border-radius: 3px; overflow: hidden; margin: 20px 0; }
.bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
@media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
<main>
  <h1>Knos demand check</h1>
  <p>Is it wanted? Qloo's taste data answers, code decides, and buyers pay the maker only on proof.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p id="state" role="status">Waking the server. A free instance sleeps when nobody uses it; the first visit can take up to a minute.</p>
  <p class="muted">Not moving? Open <a id="direct" href="https://knos.onrender.com/">the app directly</a>.</p>
</main>
<script>
"use strict";
const APP = "https://knos.onrender.com";
const start = Date.now();
async function ping() {
  try {
    // no-cors: the answer is opaque, but it only arrives once the server is awake (a network error rejects)
    await fetch(APP + "/healthz?t=" + Date.now(), { mode: "no-cors", cache: "no-store" });
    document.getElementById("state").textContent = "Awake. Taking you to the app...";
    location.replace(APP + "/" + location.hash);
  } catch (e) {
    const s = Math.round((Date.now() - start) / 1000);
    document.getElementById("state").textContent = "Still waking the server (" + s + " s). Free instances take up to a minute.";
    if (s < 180) setTimeout(ping, 4000);
    else document.getElementById("state").textContent = "The server did not answer in 3 minutes. Try the direct link below.";
  }
}
ping();
</script>
</body>
</html>

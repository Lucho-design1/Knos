name: Knos Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: knos-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Knos Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # the BASE commit only (pull_request_target's default): the local copy of actions/gate and the Knos wheel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/knos-gate
        with:
          knos-spec: ${{ github.workspace }}/.knos-dist/knos-0.3.28-py3-none-any.whl
          hidden-tests: ${{ secrets.KNOS_GATE_HIDDEN }}
          receipt-key: ${{ secrets.KNOS_RECEIPT_KEY }}

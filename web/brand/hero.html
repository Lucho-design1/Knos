<div class="k-hero" id="k-hero" data-api="{API}" data-app="{APP}">
  <h1 id="k-mission" class="k-mission">Carry research from every field of science across the valley of death.</h1>
  <form class="k-ask" id="k-ask" autocomplete="off" role="search" aria-label="Check demand">
    <input id="k-q" name="q" type="text" aria-label="A DOI, an arXiv id or an idea" maxlength="500" placeholder="A DOI, an arXiv id or an idea" enterkeyhint="go" spellcheck="false">
    <button id="k-go" type="submit">Check demand</button>
  </form>
  <div class="k-try" role="group" aria-label="Examples, one per technology">
    <button type="button" class="k-chip" data-tech="ai" data-q="an AI recipe planner for families">AI recipes</button>
    <button type="button" class="k-chip" data-tech="web3" data-q="a crypto podcast for beginners">Crypto podcast</button>
    <button type="button" class="k-chip" data-tech="quantum" data-q="a quantum physics book for kids">Quantum book</button>
    <button type="button" class="k-chip" data-tech="energy" data-q="a solar powered music festival">Solar festival</button>
    <button type="button" class="k-chip" data-tech="biotech" data-q="a probiotic kombucha brand">Kombucha</button>
    <button type="button" class="k-chip" data-tech="materials" data-q="a recycled ocean plastic swimwear brand">Ocean swimwear</button>
    <button type="button" class="k-chip" data-tech="biotech" data-q="10.1038/nature16521">A paper: sweat sensor</button></div>
  <div id="k-card" class="k-slot" aria-live="polite"></div>
  <script type="application/json" id="k-proof">null</script>
  <p class="k-agent" data-not-prose>Agents: MCP at <code>https://knos.onrender.com/mcp</code>, tool <code>knos_cross</code></p>
<!-- k-vectors -->
</div>

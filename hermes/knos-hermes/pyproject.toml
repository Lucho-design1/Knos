[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knos-hermes"
version = "0.1.0"
description = "Knos as a Hermes Agent memory provider: one local memory every coding agent on the machine shares."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "drexthealpha", email = "zulibro1999@gmail.com" }]
keywords = ["hermes", "hermes-agent", "memory", "mcp", "agents", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["knos>=0.1.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
knos-hermes = "knos_hermes.install:main"

[project.urls]
Homepage = "https://github.com/drexthealpha/Knos/tree/knos-0.3.34/hermes/knos-hermes"
Documentation = "https://github.com/drexthealpha/Knos/blob/knos-0.3.34/docs/reference/HERMES.md"
Knos = "https://github.com/drexthealpha/Knos"

[tool.hatch.build.targets.wheel]
packages = ["src/knos_hermes"]
artifacts = ["src/knos_hermes/plugin/plugin.yaml"]

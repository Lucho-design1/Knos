name: knos referee (FROST host 2 of 3)

# Knos's referee panel is ONE FROST threshold key (the Zcash Foundation's frost-ed25519, RFC 9591) split across three
# hosts; any two release a milestone, one alone signs nothing (docs/reference/REFEREE_FROST.md). This workflow is
# host 2: its key share lives only in the repository secret KNOS_REFEREE_FROST_SHARE.
#
# Nobody starts it with a token: it runs on a cron every 5 minutes (GitHub may start a scheduled run late) and on
# workflow_dispatch, and pulls the open signing sessions from the app server (knos.onrender.com/api/referee/pending).
# With none open it stops after one HTTPS read. For each open session it:
#   1. RE-CHECKS THE MILESTONE ITSELF: reads the order on devnet, fetches the maker's evidence page, requires the claim
#      id in it, recomputes the verdict digest; anything else (another digest, another panel, a closed order) is
#      refused and nothing is signed;
#   2. FROST round 1: posts its commitments (nonces stay in this job's memory, used once);
#   3. FROST round 2: when it is one of the two signers, posts its signature share.
# Every post carries (a) this job's GitHub Actions OIDC token, audience knos-referee, which the app server verifies
# against GitHub's published keys (repository drexthealpha/Knos by id, workflow .github/workflows/referee.yml on
# refs/heads/main; knos.threshold.ghoidc), and (b) the host's transport signature over the session and body.
#
# THE CODE REFEREE'S ATTESTATION (knos.threshold.codeattest; docs/reference/REFEREE_FROST.md). For every session whose
# digest its own check recomputed, job `sign` writes one verdict file (canonical JSON: session, digest, order, evidence
# page sha256, and this run's repository, workflow_ref, commit and run id) and keeps it as the run's artifact. Job
# `attest`, which holds NO key share and no secret, then:
#   1. has actions/attest-build-provenance sign a SLSA provenance statement over the verdict files (Sigstore keyless,
#      public-good instance: a Fulcio certificate for this run's identity, logged in Rekor; no account);
#   2. posts each verdict, that bundle and a fresh OIDC token whose audience is knos-referee:verdict:<sha256 of the
#      verdict> to the app server, which has the DEPLOYED knos_oidc verify the token on Solana devnet and checks the
#      bundle against Sigstore's trust root. The milestone page shows the run, that transaction, the attestation and
#      the FROST release.
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [knos-referee]      # host 1 (the app) wakes host 2 when a session opens, if it holds a token for it
  workflow_dispatch:
    inputs:
      session:
        description: "referee session id (32 hex characters); empty: every open session"
        required: false
        default: ""

permissions: {}

concurrency:
  group: knos-referee
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write   # the job's OIDC token (audience knos-referee) authenticates its posts to the app server
    outputs:
      verdicts: ${{ steps.kept.outputs.verdicts }}
    env:
      KNOS_CLUSTER: devnet
      KNOS_REFEREE_COORDINATOR: https://knos.onrender.com
    steps:
      - name: open sessions on the app server (read-only)
        id: pending
        env:
          SESSION: ${{ inputs.session }}
        run: |
          if [ -n "$SESSION" ]; then
            case "$SESSION" in *[!0-9a-f]*) echo "session: 32 hex characters"; exit 1;; esac
            [ "${#SESSION}" -eq 32 ] || { echo "session: 32 hex characters"; exit 1; }
            echo "open=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n="$(curl -fsS --max-time 60 --retry 2 "$KNOS_REFEREE_COORDINATOR/api/referee/pending" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("sessions", [])))' || echo 0)"
          echo "open sessions: $n"
          echo "open=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.pending.outputs.open == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      # A job that holds a key share uses no Actions cache and installs nothing unhashed (tests/test_workflows2.py):
      # knos-frost is built from its committed Cargo.lock (--locked) each run, the Python side is requirements/sign.txt
      # (`--require-hashes`) with this checkout's src on PYTHONPATH.
      - name: build knos-frost (frost-ed25519 =3.0.0, Cargo.lock)
        if: steps.pending.outputs.open == '1'
        run: cargo build --release --locked --manifest-path tools/knos-frost/Cargo.toml
      - if: steps.pending.outputs.open == '1'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: install what the signer needs, each by its hash, and nothing else
        if: steps.pending.outputs.open == '1'
        timeout-minutes: 6
        env:
          UV_HTTP_TIMEOUT: "30"
          UV_HTTP_RETRIES: "5"
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r requirements/sign.txt
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      - name: sign the open sessions (the share never leaves this step's environment, never printed)
        if: steps.pending.outputs.open == '1'
        env:
          KNOS_REFEREE_FROST_SHARE: ${{ secrets.KNOS_REFEREE_FROST_SHARE }}
          KNOS_FROST_BIN: ${{ github.workspace }}/tools/knos-frost/target/release/knos-frost
          PYTHONPATH: ${{ github.workspace }}/src
          SESSION: ${{ inputs.session }}
        run: |
          if [ -z "$KNOS_REFEREE_FROST_SHARE" ]; then echo "the repository secret KNOS_REFEREE_FROST_SHARE is not set"; exit 1; fi
          if [ -n "$SESSION" ]; then
            python -m knos.threshold sign-session --session "$SESSION" --github-oidc --verdicts referee-verdicts
          else
            python -m knos.threshold serve --once --github-oidc --verdicts referee-verdicts
          fi
      - name: the code referee's verdicts (data its own check wrote; no secret in them)
        id: kept
        if: always() && steps.pending.outputs.open == '1'
        run: |
          n="$(find referee-verdicts -name 'verdict-*.json' 2>/dev/null | wc -l)"
          echo "verdicts: $n"
          echo "verdicts=$n" >> "$GITHUB_OUTPUT"
      - if: always() && steps.kept.outputs.verdicts != '' && steps.kept.outputs.verdicts != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: referee-verdicts
          path: referee-verdicts/verdict-*.json
          if-no-files-found: ignore
          retention-days: 90

  # The attestation and the on-chain verification of the code referee's verdicts. No key share, no secret, no install:
  # the runner's python3 runs knos.threshold.codeattest (standard library only) from this commit's src.
  attest:
    needs: sign
    if: always() && needs.sign.outputs.verdicts != '' && needs.sign.outputs.verdicts != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # the Sigstore certificate, and the token knos_oidc verifies on chain
      attestations: write   # actions/attest-build-provenance stores the attestation with the repository
    env:
      KNOS_REFEREE_COORDINATOR: https://knos.onrender.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: referee-verdicts
          path: referee-verdicts
      - name: attest the verdicts (Sigstore keyless, SLSA provenance)
        id: att
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: referee-verdicts/verdict-*.json
      - name: post each verdict with its OIDC token; the app server has knos_oidc verify it on devnet
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          BUNDLE: ${{ steps.att.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.att.outputs.attestation-url }}
        run: python3 -m knos.threshold.codeattest post --dir referee-verdicts --bundle "$BUNDLE" --attestation-url "$ATTESTATION_URL"

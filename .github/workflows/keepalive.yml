# Keeps the free Render instances awake: Render's free tier sleeps a web service after 15 minutes without traffic, so a
# visitor's first request waits for a cold start. This timer is the LAST of three pingers (docs/reference/KEEPALIVE.md):
# every run of the always-on worker's chain pings first (worker.yml, job `healthz`, about every 4.5 minutes, revived by
# the watchdog), and the referee PC daemon pings every 5 minutes (`python -m knos.threshold serve --healthz-every 300`).
# GitHub's cron alone is not reliable: on 18 Oct 2026 this file's timer went more than four hours without a run.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping knos.onrender.com/healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://knos.onrender.com/healthz) && [ "$code" = "200" ] && { echo "knos: $code"; break; }
            echo "knos: attempt $i answered ${code:-nothing}"; sleep 20
          done
          [ "$code" = "200" ]
# Only the app is kept awake: Render's free tier gives 750 instance hours a month per workspace, and one service awake
# all month uses about 744 of them. The SSO service (knos-sso) is left to sleep and wakes on its first sign-in.

# Knos builds Knos (TASK-CHAMPION): the brief that set this work is a Knos project on devnet
# (scripts/champion_project.txt holds its id). Each job below is named exactly after one milestone's verifier check and
# runs that test against the LIVE pages. Then `release` asks the app to release each milestone at this commit
# (POST /api/project/ci): the app reads GitHub's own record of these check runs and releases only a milestone whose
# check passed here, on the default branch. No key is sent: GitHub's record decides it.
name: champion
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency: {group: champion, cancel-in-progress: false}
env:
  APP_URL: https://knos.onrender.com
  SITE_URL: https://drexthealpha.github.io/Knos/
jobs:
  test_fields_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_value_vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_proof_first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_money_page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_companies_mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_legibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Every public page
        run: node scripts/test_ui_sota.mjs legibility
      - name: Every doc
        run: python scripts/split_paragraphs.py --check --strict
  test_vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: The preset, pointed at the live pages
        run: |
          node -e '
          const fs = require("fs"), pages = JSON.parse(fs.readFileSync("scripts/public_pages.json", "utf8")).pages;
          for (const [name, urls, block] of [["site", pages.filter((u) => u.includes("github.io")), ["https://knos.onrender.com/*"]],
                                             ["app", pages.filter((u) => u.includes("onrender.com")), []]]) {
            const c = require("./apps/wanted/lighthouserc.js");
            const out = JSON.parse(JSON.stringify(c));
            out.ci.collect.url = urls; out.ci.collect.numberOfRuns = 3; out.ci.collect.settings.blockedUrlPatterns = block;
            delete out.ci.assert; delete out.ci.upload;
            fs.writeFileSync(`lhci-${name}.json`, JSON.stringify(out, null, 1));
          }'
      - name: Open Chrome once (no page)
        run: |
          npx --yes @lhci/cli@0.14.0 healthcheck --fatal || true
          CHROME=$(node -e 'console.log(require("chrome-launcher").Launcher.getInstallations()[0] || "")' 2>/dev/null || true)
          "${CHROME:-google-chrome}" --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 || true
      - name: Three cold runs of every public page
        run: |
          npx --yes @lhci/cli@0.14.0 collect --config=lhci-site.json
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
          npx --yes @lhci/cli@0.14.0 collect --config=lhci-app.json --additive
      - run: node scripts/test_quality_bar.mjs vitals .lighthouseci
  test_stack_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - run: python scripts/test_stack_coverage.py "$APP_URL"
  test_outside_judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/test_outside_judge.py
  test_knos_builds_knos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/test_knos_builds_knos.py "$(cat scripts/champion_project.txt)" --except test_knos_builds_knos
  release:
    needs: [test_fields_matrix, test_value_vectors, test_proof_first, test_money_page, test_companies_mode, test_legibility,
            test_vitals, test_stack_coverage, test_outside_judge, test_knos_builds_knos]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ask the app to release each milestone whose check passed at this commit
        run: |
          pid=$(cat scripts/champion_project.txt)
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
          curl -fsS -m 60 "$APP_URL/api/project?id=$pid" | python3 -c 'import json,sys; [print(m["key"], m["verifier"]["check"], m["status"]) for m in json.load(sys.stdin)["milestones"]]' > milestones.txt
          while read -r key check status; do
            [ "$status" = released ] && { echo "$check: already released"; continue; }
            body=$(printf '{"project":"%s","milestone":"%s","sha":"%s"}' "$pid" "$key" "$GITHUB_SHA")
            code=$(curl -sS -m 300 -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$APP_URL/api/project/ci")
            echo "$check: HTTP $code $(head -c 400 out.json)"
          done < milestones.txt

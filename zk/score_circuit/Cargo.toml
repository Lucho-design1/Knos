# The private-score circuit and its prover (arkworks Groth16 over BN254), run off chain.
#
#   cd zk/score_circuit && cargo run --release -- ../fixtures/score64 ../../programs-v2/knos_zk/src/vk.rs
#
# writes the small fixtures the Python tests read (verifying key, proof, public inputs, the SYNTHETIC private sample)
# and the verifying key the on-chain program embeds. `cargo test --release` checks the proof with arkworks and with
# groth16-solana (the verifier the program runs), refuses tampered proofs, and refuses to prove a score below the bar.
# Not a member of any workspace (the empty [workspace] below): the programs' build knows nothing of it.
[package]
name = "knos-zk-score"
version = "0.3.29"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "knos-zk-score"
path = "src/main.rs"

[dependencies]
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
groth16-solana = "=0.2.0"

[profile.release]
debug = false

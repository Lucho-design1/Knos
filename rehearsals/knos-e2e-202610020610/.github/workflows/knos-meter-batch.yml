# Staging copy of examples/knos-meter-batch.yml, started by hand only. It calls attest.yml of the released Knos
# workflows (drexthealpha/knos-workflows at 64b31fae, Knos v0.3.24), which installs knos 0.3.24 from PyPI by its hash,
# as the released example does. Before, it called Knos's own .github/workflows/attest.yml at v0.3.19, whose lock is
# the unfilled KNOS_LOCK line (knos-workflows holds the filled copy), and before that a mirror of the 0.3.18 tree's
# attest.yml that installed knos from the staging repository.
name: knos meter batch

on:
  workflow_dispatch:
    inputs:
      order:
        description: "The ledger file's path in this repository; add :yyyymm.seq to name one batch (else: the next one the chain has not taken)"
        required: true
        type: string
        default: meter/f1-ledger.jsonl
      kind:
        description: "Whose count: batch (you are the buyer) or claim (you are the seller)"
        required: true
        type: choice
        options: [batch, claim]
        default: batch

permissions: {}

jobs:
  hand:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: drexthealpha/knos-workflows/.github/workflows/attest.yml@64b31fae2b0050ee6abeeb763442172f42398cd5 # Knos v0.3.24
    with:
      repository: ${{ github.repository }}
      pull: 0
      order: ${{ inputs.order }}
      kind: ${{ inputs.kind }}

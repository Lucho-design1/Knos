# knos 0.3.15 track C4: the read-only commands against devnet, run once on a GitHub runner (staging, Knos's own account).
# Nothing here signs or sends a transaction, and it needs no secret.
name: knos c4 reads

on:
  workflow_dispatch:

permissions: {}

jobs:
  reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false
          ignore-empty-workdir: true
      - name: install knos, the released wheel (0.3.28)
        run: uv tool install --no-config "knos==0.3.28"
      - name: the commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p out && cd out
          run() { echo "\$ knos $*"; timeout 1200 knos "$@"; echo "[exit $?]"; echo; }
          {
          run --version
          echo "=== PUBLIC program ids"
          run budget show --owner drexthealpha
          run budget check --owner drexthealpha --balance EuuemHS1W5j6BRrtJadXZ59AxXphWa3pEdKTyHzd8HyU --repo drexthealpha/knos-e2e --amount 0.6 --by drexthealpha
          run budget check --owner drexthealpha --balance EuuemHS1W5j6BRrtJadXZ59AxXphWa3pEdKTyHzd8HyU --repo drexthealpha/knos-e2e --amount 5 --by drexthealpha
          run observe 79ELTFsEMBz1xZL4jUL5HHKUd71My8QrNPaaJvJkiraF
          run observe 5bRp3jUS1z9zpeXkTJ2HCEzuepzaLEGxDGsSPmJNrCY9kYes6dC57pfD3ox8Y8tEbHPn2dcAkrKJ8FdmUVfg82zw
          run observe --graph 142920951 --limit 300
          run bundle make 5bRp3jUS1z9zpeXkTJ2HCEzuepzaLEGxDGsSPmJNrCY9kYes6dC57pfD3ox8Y8tEbHPn2dcAkrKJ8FdmUVfg82zw --limit 300
          run audit export --owner drexthealpha --from 2026-09-01 --to 2026-10-04 --format csv --out audit-public.csv
          [ -f audit-public.csv ] && sha256sum audit-public.csv && wc -l audit-public.csv && run audit verify audit-public.csv
          echo "=== STAGING program ids (the 0.3.14 rehearsal's own deployment of the 2.1 build), by KNOS_PROGRAM_IDS"
          echo '{"knos_oidc": "iosu8ARUNvvruHPCcMWQ5rqsnJewzBxcPXajSpoHqXd", "knos_pay": "FJJtqcRjQ9ATx37sBTCLUBxBqLUA9aQgSTLAsZynqtnH", "knos_meter": "7MzKH2Mm7hUD4g9SdCMmL1MR4SBPBUaZXP4RwiFs8ZGo", "knos_passkey": "8YwdomJwYQJV7adkqgNyehdZ3tZhpTsp6SFUNfTsKKxk"}' > staging-ids.json
          export KNOS_PROGRAM_IDS=$PWD/staging-ids.json
          run bundle make 63wT5rhYhEKbgmF5k8vEKdexzoCaXZCiDvRG2GQMGSMBBsc9avGfDw3izER9D6LHoe4ucJeinTBiWaWGWpnFWvfq --out staging-63wT5.bundle.tar
          [ -f staging-63wT5.bundle.tar ] && sha256sum staging-63wT5.bundle.tar
          run bundle verify staging-63wT5.bundle.tar --no-chain
          O=$(tar -xOf staging-63wT5.bundle.tar MANIFEST.json 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)["order"])' 2>/dev/null)
          echo "order=$O"
          [ -n "$O" ] && run observe "$O"
          [ -n "$O" ] && run budget show --owner drexthealpha
          } 2>&1 | tee c4.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: knos-c4
          path: out/

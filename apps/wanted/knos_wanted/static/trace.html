<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knos. The Qloo trace of a demand check</title>
<meta name="description" content="Every Qloo call behind a demand check: endpoint, parameters with entity and tag ids, an excerpt of the result, and its limit. No key and no personal data.">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<style>
.tr-call{border:1px solid var(--line, #d8d8d8);border-radius:10px;padding:10px 12px;margin:10px 0;min-width:0}
.tr-call:target{outline:2px solid currentColor}
.tr-call h3{margin:0 0 6px;font-size:1rem}
.tr-call dl{display:grid;grid-template-columns:minmax(6rem,auto) 1fr;gap:4px 10px;margin:0}
.tr-call dt{font-weight:600}
.tr-call dd{margin:0;overflow-wrap:anywhere;min-width:0}
.tr-call code{font-size:.85rem}
@media (max-width:480px){.tr-call dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="bar">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>Knos</a>
  <a href="/" class="small">← app</a>
</div></div></header>
<main class="wrap">
  <h1>The Qloo trace</h1>
  <p id="tr-limit" class="small"></p>
  <div id="tr-head"></div>
  <ol id="tr-calls" class="list" aria-label="Qloo calls"></ol>
  <p class="small muted">Redacted: the API key is a request header and never appears here; no personal data is sent to Qloo.
    <a href="/qloo-safe-use">How Knos uses Qloo safely</a>.</p>
</main>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ids = (params) => Object.entries(params || {}).filter(([k, v]) => /entit|tag|audience|id/.test(k) || /^urn:|^[0-9A-F]{8}-/.test(String(v)));
(async () => {
  const h = new URLSearchParams(location.search).get("hash") || "";
  const r = await fetch("/api/trace?hash=" + encodeURIComponent(h));
  const t = await r.json();
  if (!r.ok) { document.getElementById("tr-head").innerHTML = `<p>${esc(t.error || "No trace for this report.")}</p>`; return; }
  document.getElementById("tr-limit").textContent = t.limit;
  document.getElementById("tr-head").innerHTML = `<p><b>Idea:</b> ${esc(t.idea)}</p>
    <p><b>Decision:</b> ${esc(t.decision.verdict)}${t.without_qloo ? " (run with the Qloo key unset)" : ""} · ${esc(t.label)}</p>
    <p class="small muted">Report <span class="mono">${esc(String(t.hash).slice(0, 16))}</span> · ${esc(t.made || "")} · ${t.calls.length} Qloo call(s)</p>`;
  document.getElementById("tr-calls").innerHTML = t.calls.map((c) => `<li class="tr-call" id="call-${esc(c.n)}">
    <h3>Call ${esc(c.n)}: <code>${esc(c.endpoint)}</code></h3>
    <dl><dt>What for</dt><dd>${esc(c.what)}${c.used_for ? " → " + esc(c.used_for) : ""}</dd>
      <dt>Request</dt><dd><code>${esc(JSON.stringify(c.params))}</code></dd>
      <dt>Ids</dt><dd>${ids(c.params).map(([k, v]) => `<code>${esc(k)}=${esc(v)}</code>`).join(" ") || "none"}</dd>
      <dt>Result</dt><dd>${esc(c.excerpt || "")}</dd>
      <dt>When</dt><dd>${esc(c.at || "")}${c.cached ? " (from the server's cache)" : ""}</dd>
      <dt>Limit</dt><dd>aggregate taste, not causal, not about a person</dd></dl></li>`).join("");
  if (location.hash) { const e = document.querySelector(location.hash); if (e) e.scrollIntoView(); }
})();
</script>
</body>
</html>

# Landmark papers, by DOI: Nobel-recognised (nobel = true) or top-cited results whose product is not on the market (nobel = false). Every row names its source:
# the nobelprize.org press release, or an official/foundation page saying no product exists (read 16-17 Oct 2026).
# `said` quotes that release (one short sentence); `enables` is the product phrase Knos proposes from it (the maker
# can edit it). `products_on_market` says what the release itself says about products; it is not Knos's claim.


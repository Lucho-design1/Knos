[package]
name = "knos-hook"
version = "0.1.0"
edition = "2021"
description = "Knos's Token-2022 transfer hook: project credits move only into the account owner their rules name"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "=2.2.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }

# A workspace of its own: programs-v2/ changes only through its multisig and the 8-day wait (CONTRIBUTING.md), and this
# is a new program, deployed apart from it.
[workspace]

[profile.release]
overflow-checks = true

# THE one fee config of Knos. Everything that states, charges, quotes or charts a Knos fee reads this file through
# knos.money.fees_config (load, validate). Nothing else types a fee.
#
# Four kinds of line, and every line says which it is in `status`:
#   live         the deployed knos_pay program charges it on devnet today. The program's numbers are compiled into it
#                (knos.settle.v2.pay: FEE_BPS, FEE_MIN, TIP, TIP_FIRST, ORDER_MIN_AMOUNT, MAX_PAYEES); this file mirrors
#                them and the loader REFUSES the file when one differs, so the two cannot drift apart.
#   proposed     the price book (knos.billing, docs/PRICING.md): a plan nobody pays yet. The loader refuses a mismatch.
#   decided      a price Knos set: the starting prices of 14 Oct 2026, and the product's prices of 23 Oct 2026
#                (demand checks, Ready briefs, proof pages, the 1% release fee). Nobody pays it yet, and it is NOT
#                compiled into knos_pay: the deployed program charges only its live payout fee (0.30%). Each line's
#                `collected` says how the rest is taken; a higher rate on chain waits for a timelocked program upgrade.
#                Every decided line carries `decided`, `rationale` and `source`; the loader refuses one without them.
#   placeholder  a number not set yet. It is here so the code, the quotes and the dashboard have a shape;
#                it is not a price. `knos.money.fees_config.load().placeholders()` lists every one.
#
# Money is a decimal string in USD (one test USDC on devnet), never a float. Rates are basis points (1 bps = 0.01%).
# On devnet every fee is test money: Knos's revenue is 0.

version: 1
currency: "USD"
network: "solana devnet"
revenue_today: "0"

treasury:
  what: "the fee owner: Knos's Squads vault (a program-derived address of the Squads program). Every fee the program takes lands in a token account it owns."
  fee_owner: "4G3cznCnwCUPBCZwzKiLupjdgB5pSoCcGWNGuFv4TYFo"
  squads_program: "SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf"
  moves_by: "a Squads proposal of the vault; nothing in Knos signs for it"

onchain:
  status: "live"
  program: "knos_pay"
  build: "2.2"
  rate_bps: 30
  floor_usd: "0.05"
  plan_floor_bps: 20
  relayer_tip_usd: "0.05"
  relayer_tip_first_usd: "0.30"
  order_min_usd: "5.00"
  max_payees: 4

fees:
  verification:
    status: "proposed"
    what: "one verification (an evaluation of a pull request or a result) on runners Knos hosts"
    public_repos_usd: "0"
    self_host_usd: "0"
    free_per_month: 100000
    usd_each: "0.002"
    note: "Checking stays free for public repositories and on your own runners; this is the Meter line of the price book."
  demand_check:
    status: "decided"
    what: "a demand check: an idea or a paper checked against Qloo demand evidence"
    free_a_month: 10
    beyond: "not set by the decision"
    today: "free; the monthly count is not enforced yet"
    decided: "23 Oct 2026"
    rationale: "the product prices: 10 demand checks a month free; Ready briefs and proof pages free; a deep demand check 500 USD; a 1% release fee paid by the company"
    source: "price set 23 Oct 2026"
  deep_demand_check:
    status: "decided"
    what: "a deep demand check, paid by card"
    usd_each: "500"
    payer: "the company"
    collected: "by card, from the day the company exists; no company is formed yet, so nobody is charged today, and card payment is not built"
    decided: "23 Oct 2026"
    rationale: "the product prices: 10 demand checks a month free; Ready briefs and proof pages free; a deep demand check 500 USD; a 1% release fee paid by the company"
    source: "price set 23 Oct 2026"
  ready_brief:
    status: "decided"
    what: "a Ready brief: free"
    usd_each: "0"
    decided: "23 Oct 2026"
    rationale: "the product prices: 10 demand checks a month free; Ready briefs and proof pages free; a deep demand check 500 USD; a 1% release fee paid by the company"
    source: "price set 23 Oct 2026"
  proof_page:
    status: "decided"
    what: "a proof page: free"
    usd_each: "0"
    decided: "23 Oct 2026"
    rationale: "the product prices: 10 demand checks a month free; Ready briefs and proof pages free; a deep demand check 500 USD; a 1% release fee paid by the company"
    source: "price set 23 Oct 2026"
  release:
    status: "decided"
    what: "the release fee: 1% of the money held until the proof passes and then released, paid by the company (the funder) on top; the solver keeps 100% of what they are paid"
    rate_bps: 100
    payer: "the company (the funder), on top of the amount"
    payment_costs: "the company pays the card, bank or network costs of paying in, on top of the 1%; the solver keeps 100%"
    card_max_usd: "500"
    above_card: "a milestone above 500 USD is paid in by bank transfer or USDC"
    today: "the deployed knos_pay charges its live payout fee, 0.30% (at least 0.05), in test money on devnet"
    collected: "on chain by knos_pay once the timelocked program upgrade through the Squads vault carries it; no company is formed yet, so nobody is charged today"
    decided: "23 Oct 2026"
    rationale: "the product prices: 10 demand checks a month free; Ready briefs and proof pages free; a deep demand check 500 USD; a 1% release fee paid by the company"
    source: "price set 23 Oct 2026"
  payout:
    status: "live"
    what: "the fee on every release of held money to a payee (the Acceptance line): the funder pays it on top of the amount"
    rate_bps: 30
    floor_usd: "0.05"
    payer: "funder, on top of the amount"
  bounty:
    status: "live"
    what: "a bounty is a knos_pay work order: the same fee, taken by the program and sent to the treasury at payout (the on-chain part of the bounty fee, bounty_platform)"
    rate_bps: 30
    floor_usd: "0.05"
    to: "treasury"
    refund: "a bounty refunded after its deadline returns the amount and the fee"
  bounty_platform:
    status: "decided"
    what: "the Knos bounty fee: 5% of the bounty, paid by the funder; the on-chain bounty fee (0.30%, at least 0.05) is part of it, not added to it"
    rate_bps: 500
    onchain_line: "bounty"
    collected: "the program takes the on-chain bounty fee at payout; the rest (5% minus that fee) is invoiced off chain, because knos_pay's fee is compiled into the program (0.30%) and charging 5% on chain needs a program upgrade through the Squads vault"
    decided: "14 Oct 2026"
    rationale: "5% of the bounty: a starting price, to revisit once the cost per verification is measured"
    source: "price set 14 Oct 2026"
  lab_order:
    status: "decided"
    what: "the Knos fee on a lab order paid through Knos, the money held until the proof passes (the lab is paid when its protocol and QC verdict passes): 3% of the order; the on-chain payout fee (0.30%, at least 0.05) is part of it, not added to it"
    rate_bps: 300
    onchain_line: "payout"
    collected: "the program takes the payout fee at release; the rest (3% minus that fee) is invoiced off chain until a program upgrade carries it. Who bears it (the buyer on top, or deducted from the lab's payment) is not set by the decision"
    decided: "14 Oct 2026"
    rationale: "labs already pay 2% to 3% of an invoice just to be paid sooner; Knos's 3% buys payment of the held money on a verdict"
    source: "price set 14 Oct 2026. Scientist.com SciPay: suppliers pay 3.00% (NET30), 2.50% (NET45), 2.00% (NET60), https://www.scientist.com/scipay/ (read 14 Oct 2026)"
  funding:
    status: "live"
    what: "holding money until the proof passes (a graduation milestone or a pre-order): the program holds the payout fee with the money and takes it only at release"
    rate_bps: 0
  graduation:
    status: "decided"
    what: "a fee on the value of the milestone's held money and the pre-order pool released after a claim graduates, above the payout fee"
    rate_bps: 50
    collected: "by contract, off chain, until a knos_pay build carries it (a program upgrade); on chain today only the payout fee is taken"
    decided: "14 Oct 2026"
    rationale: "0.5% of money raised: a starting price, to revisit once the cost per verification is measured"
    source: "price set 14 Oct 2026"
  task_package:
    status: "decided"
    what: "Knos's share of a sale of a sealed task package (issue + hidden tests + cheat rules); the maintainer keeps the rest"
    knos_bps: 1000
    market: "labs pay 200 to 2,000 USD per task (Epoch AI, 12 Jan 2026); robustness to reward hacking is the top buying criterion (same source)"
    collected: "off chain, by contract (a sale of a task package is not a knos_pay order today)"
    decided: "14 Oct 2026"
    rationale: "the maintainer who wrote the task keeps 90%; Knos keeps 10%"
    source: "price set 14 Oct 2026"
  verified_merge:
    status: "decided"
    what: "one pull request the Knos referee verified (sealed tests passed, no cheat rule fired, the re-run agreed) for a team running coding agents, billed to the team per verified merge"
    usd_each: "1.00"
    free_first: 1
    label: "starting price"
    collected: "invoiced from the team's usage record checked against the chain (knos.money.teams); paid in USDC on Solana (x402 exact through the x402.org facilitator, or a knos_pay order that holds the money until the proof passes); card and bank through Airwallex later (not built)"
    decided: "14 Oct 2026"
    rationale: "1.00 USD per verified merge is a STARTING PRICE for teams, to revisit once the cost per verification is measured; the first verification of every team is free, so a team sees a verdict before it pays"
    source: "price set 14 Oct 2026"
  x402_check:
    status: "decided"
    what: "a paid check bought by an agent over x402, in devnet USDC (test money): one check by the standard exact scheme (x402.org facilitator), or a pack by the knos-order scheme (the smallest order is 5.00)"
    usd_each: "0.02"
    mint: "devnet USDC (test money) until the cost per verification is measured"
    decided: "14 Oct 2026"
    rationale: "a per-check price for agents paying over x402, apart from the hosted Meter line of the price book (0.002 after the free month)"
    source: "price set 14 Oct 2026"

splits:
  status: "decided"
  what: "the fixed share of every payout each contributor role receives, in basis points; one order pays at most 4 payees, so 4 roles"
  rounding: "each share is rounded down; the last payee receives what is left, exactly as knos_pay pays (order_pay.rs)"
  decided: "14 Oct 2026"
  rationale: "60 researcher / 25 agents / 10 labs / 5 referees"
  source: "price set 14 Oct 2026"
  roles:
    researcher: 6000
    agent: 2500
    lab: 1000
    referee: 500

game_pot:
  status: "placeholder"
  what: "how a Knos game's pooled pot is divided by the referee's final verdicts: the winner's share, and a partial-credit share divided among the other passing attempts in proportion to their lift (at most max_paid payees, one knos_pay order pays 1 to 4); the Knos fee on a pot is the bounty fee (fee_line), paid by the funders on top"
  winner_bps: 7000
  partial_bps: 3000
  max_paid: 4
  fee_line: "bounty_platform"
  note: "winner_bps and partial_bps are placeholders until they are set; nobody pays a pot on devnet but test money"

cloud:
  status: "decided"
  what: "Knos Cloud: paid credits for hosted verification (runners, sealed-test storage, receipts, Gate for private repositories). Everything stays open source (MIT) and self-hosting stays free."
  decided: "14 Oct 2026"
  rationale: "three monthly tiers of 20, 100 and 200 USD, each with 10% bonus credit (22, 110 and 220 USD of credit a month)"
  source: "price set 14 Oct 2026, on the Nous Portal pattern (see shape_from); the 10% bonus is Knos's own, not a sourced Nous figure"
  bonus_bps: 1000
  units_status: "placeholder"
  units_what: "what one credit is worth and what each use consumes are not decided: credit_usd, consumes and so each tier's credit count are placeholders"
  credit_usd: "0.002"
  consumes:
    hosted_verification: 1
    sealed_test_storage_gb_month: 50
    receipt: 0
    private_repo_gate_check: 1
  tiers:
    - name: "Starter"
      usd_month: "20"
      credit_usd_month: "22"
      credits_month: 11000
    - name: "Pro"
      usd_month: "100"
      credit_usd_month: "110"
      credits_month: 55000
    - name: "Team"
      usd_month: "200"
      credit_usd_month: "220"
      credits_month: 110000
  enterprise: "by contract (the Control line of the price book)"
  shape_from: "Nous Research's Portal sells $20/$100/$200 monthly tiers (TechCrunch, 7 Oct 2026, citing the WSJ; unaudited). Knos's tier prices match it (price set 14 Oct 2026); the credit unit is a placeholder."

sources:
  nous:
    said: "Nous Research: open core (MIT) plus hosted subscriptions with credits (Portal $20/$100/$200 tiers) plus enterprise; about $36M annualized revenue by mid-September 2026; raised $90M at a $1.5B valuation"
    source: "TechCrunch, 7 Oct 2026, citing the Wall Street Journal"
    audited: false
  epoch_tasks:
    said: "labs pay 200 to 2,000 USD per verified task; robustness to reward hacking is the top buying criterion"
    source: "Epoch AI, 12 Jan 2026 (An FAQ on reinforcement learning environments, https://epoch.ai/gradient-updates/state-of-rl-envs, read 14 Oct 2026: an interviewed founder saw 200 to 2,000 USD per task mostly; interviewees consistently cite robustness against reward hacking)"
    audited: false
  github_merges:
    said: "merged pull requests on GitHub grew from about 25 million a month in January 2023 to more than 90 million a month (GitHub's own figure, in its post on pull request limits)"
    source: "Visual Studio Magazine, 30 Jun 2026, https://visualstudiomagazine.com/articles/2026/06/30/github-extends-contribution-controls-from-prs-to-issues.aspx (read 14 Oct 2026)"
    audited: false
  slop_audit:
    said: "of agent pull requests whose description said tests pass and whose CI finished, 1,119 of 3,736 (30%) had a failing check at the head commit; 6,059 of the 8,954 agent pull requests that fail a measured Knos check were merged anyway"
    source: "docs/reference/BENCH.md (Knos's own audit of the hao-li/AIDev dataset, GitHub check records read 13 Oct 2026)"
    audited: false
  scipay:
    said: "Scientist.com SciPay: suppliers pay 3.00% (NET30), 2.50% (NET45) or 2.00% (NET60) to be paid early, plus 0.75% for currencies other than USD"
    source: "https://www.scientist.com/scipay/ (read 14 Oct 2026)"
    audited: false
